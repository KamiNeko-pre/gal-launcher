name: Release Portable EXE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.3)'
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run check

      - name: Build portable exe
        run: npm run dist:portable

      - name: Zip complete directory build
        run: Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/Gal-Launcher.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            release/Gal Launcher.exe
            release/Gal-Launcher.zip
          draft: true
          prerelease: false
